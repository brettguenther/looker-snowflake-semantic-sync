[project]
name = "snowflake-semantic-sync"
version = "0.1.0"
description = "Snowflake Semantic Views to Looker LookML (sql_analytic_model_name) Synchronization Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "cryptography>=42.0.0",
    "lkml>=1.3.7",
    "looker-sdk>=24.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "snowflake-connector-python>=3.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
snowflake-semantic-sync = "snowflake_semantic_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/snowflake_semantic_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
